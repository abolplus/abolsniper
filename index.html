<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>ABOL SNIPER</title>
<style>
:root{--bg:#050505;--green:#39ff14;--text:#f5f5f5;--muted:#858585;--border:rgba(57,255,20,.15)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{width:100%;min-height:100%;scroll-behavior:smooth}
body{width:100%;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% -10%,rgba(57,255,20,.055),transparent 35%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button{border:0;outline:0;font-family:inherit;cursor:pointer}
#loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#050505;transition:opacity .75s ease,visibility .75s ease}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-logo{direction:ltr;display:flex;align-items:center;white-space:nowrap;font-size:37px;font-weight:900;letter-spacing:3px}
.loader-logo .abol{display:inline-block;color:#fff;opacity:0;animation:loaderAbol .8s ease-out forwards}
.loader-logo .sniper{display:inline-block;color:var(--green);opacity:0;transform:translateY(12px);text-shadow:0 0 14px rgba(57,255,20,.15);animation:loaderSniper .65s ease-out .25s forwards}
@keyframes loaderAbol{0%{opacity:0}100%{opacity:1}}
@keyframes loaderSniper{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
.top-bar{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:1000;padding:9px 17px;border:1px solid var(--border);border-radius:999px;background:rgba(8,8,8,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 25px rgba(57,255,20,.045),inset 0 0 15px rgba(255,255,255,.015);opacity:0;animation:topBarIn .7s cubic-bezier(.2,.8,.2,1) 2.15s forwards}
@keyframes topBarIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.top-logo{direction:ltr;display:flex;align-items:center;white-space:nowrap;color:#fff;font-size:13px;font-weight:900;letter-spacing:1.8px}
.top-logo .abol,.top-logo .sniper{color:#fff}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.center-logo{direction:ltr;display:flex;align-items:center;white-space:nowrap;font-size:42px;font-weight:900;letter-spacing:3px;user-select:none;opacity:0;animation:centerAppear .9s ease-out 1.15s forwards,softFloat 6.5s ease-in-out 2s infinite}
.center-logo .abol{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.07)}
.center-logo .sniper{color:var(--green);text-shadow:0 0 12px rgba(57,255,20,.16),0 0 28px rgba(57,255,20,.07)}
@keyframes centerAppear{from{opacity:0;transform:translateY(5px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes softFloat{0%{transform:translateY(-7px)}50%{transform:translateY(7px)}100%{transform:translateY(-7px)}}
#snow-container{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.snow{position:absolute;top:-20px;width:4px;height:4px;border-radius:50%;background:#39ff14;box-shadow:0 0 8px rgba(57,255,20,.65);opacity:0;animation:snowFall 5s linear forwards}
@keyframes snowFall{0%{transform:translate3d(0,-20px,0);opacity:0}10%{opacity:.65}80%{opacity:.45}100%{transform:translate3d(35px,110vh,0);opacity:0}}
.bottom-nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);z-index:2000;width:min(315px,calc(100% - 90px));padding:7px 5px;display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--border);border-radius:18px;background:rgba(10,10,10,.78);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);box-shadow:0 12px 35px rgba(0,0,0,.55),0 0 22px rgba(57,255,20,.035);opacity:0;animation:bottomBarIn .7s cubic-bezier(.2,.8,.2,1) 2.2s forwards}
@keyframes bottomBarIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.nav-button{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:14px;background:transparent;color:var(--muted);font-size:10px;font-weight:800;transition:color .25s ease,background .25s ease,transform .2s ease}
.nav-symbol{color:currentColor;font-size:14px;line-height:1;transition:transform .25s ease}
.nav-button.active{color:var(--green);background:rgba(57,255,20,.07);box-shadow:inset 0 0 12px rgba(57,255,20,.025)}
.nav-button:hover{color:var(--green)}
.nav-button:active{transform:scale(.94)}
.nav-button:active .nav-symbol{transform:scale(.88)}
.ripple{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(57,255,20,.24);transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:ripple .65s ease-out forwards}
@keyframes ripple{0%{opacity:.7;transform:translate(-50%,-50%) scale(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(16)}}
@media(max-width:380px){.loader-logo{font-size:32px;letter-spacing:2px}.center-logo{font-size:32px;letter-spacing:2px}.top-logo{font-size:12px}.bottom-nav{width:calc(100% - 70px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="loader"><div class="loader-logo"><span class="abol">ABOL</span><span class="sniper">&nbsp;SNIPER</span></div></div>
<div id="snow-container"></div>
<header class="top-bar"><div class="top-logo"><span class="abol">ABOL</span><span class="sniper">&nbsp;SNIPER</span></div></header>
<main class="center"><div class="center-logo"><span class="abol">ABOL</span><span class="sniper">&nbsp;SNIPER</span></div></main>
<nav class="bottom-nav">
<button class="nav-button" onclick="support(this)"><span class="nav-symbol">⌁</span><span>پشتیبانی</span></button>
<button class="nav-button active" onclick="goHome(this)"><span class="nav-symbol">⌂</span><span>خانه</span></button>
<button class="nav-button" onclick="channel(this)"><span class="nav-symbol">◉</span><span>کانال</span></button>
</nav>
<script>
const SUPPORT="abolplus";
const CHANNEL="abolsniper";
function telegram(id){id=id.replace("@","").trim();return "https://t.me/"+id}
window.addEventListener("load",()=>{setTimeout(()=>{document.getElementById("loader").classList.add("hide")},2100)});
const snowContainer=document.getElementById("snow-container");
function createSnow(){const snow=document.createElement("span");snow.className="snow";snow.style.left=Math.random()*100+"%";const size=Math.random()*3+2;snow.style.width=size+"px";snow.style.height=size+"px";snow.style.animationDuration=(Math.random()*2+4)+"s";snow.style.filter=`blur(${Math.random()*.4}px)`;snowContainer.appendChild(snow);setTimeout(()=>{snow.remove()},7000)}
function randomSnow(){createSnow();const nextTime=Math.random()*3500+5000;setTimeout(randomSnow,nextTime)}
setTimeout(randomSnow,4500);
function addRipple(button){const ripple=document.createElement("span");ripple.className="ripple";ripple.style.left="50%";ripple.style.top="50%";button.appendChild(ripple);setTimeout(()=>{ripple.remove()},700)}
function setActive(button){document.querySelectorAll(".nav-button").forEach(item=>{item.classList.remove("active")});button.classList.add("active");addRipple(button)}
function support(button){setActive(button);window.location.href=telegram(SUPPORT)}
function channel(button){setActive(button);window.location.href=telegram(CHANNEL)}
function goHome(button){setActive(button);window.scrollTo({top:0,behavior:"smooth"})}
</script>
</body>
</html>
